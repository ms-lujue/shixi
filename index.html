<!doctype html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <title>实习证明下载（身份证后6位）</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 40px; }
    label, input, button { font-size: 16px; }
    #msg { color: red; margin-top: 10px; }
    .tip { margin-top: 10px; color: red; }
  </style>
</head>
<body>
  <h2>实习证明下载</h2>
  <p class="tip">
    请仔细核对姓名、性别、身份证号、学号、实习单位和实习时间。
  </p>
  <p>
    <label for="id6">请输入本人身份证号后6位：</label>
    <input type="text" id="id6" maxlength="6">
    <button id="action-button" onclick="downloadProof()">下载</button>
  </p>
  <div id="msg"></div>

  <!-- 用于触发浏览器下载的隐藏链接 -->
  <a id="hidden-download-link" style="display:none;"></a>

  <script>
    async function downloadProof() {
      var button = document.getElementById('action-button');
      if (button.disabled) return;
      // 按字符串读取，保留前导 0，将末尾小写 x 统一为大写 X。
      var id6 = document.getElementById('id6').value.trim().toUpperCase();
      var msg = document.getElementById('msg');
      var link = document.getElementById('hidden-download-link');
      if (!id6) {
        msg.textContent = "请先输入身份证后6位";
        return;
      }
      if (!/^\d{5}[\dX]$/.test(id6)) {
        msg.textContent = "请输入身份证号后6位（5位数字加数字或X）";
        return;
      }
      button.disabled = true;
      msg.textContent = "正在查找图片，请稍候…";
      var extensions = ['png', 'jpg', 'jpeg', 'PNG', 'JPG', 'JPEG'];
      try {
        for (var extension of extensions) {
          var url = 'img/' + id6 + '.' + extension;
          var testImg = new Image();
          var exists = await new Promise(function(resolve) {
            testImg.onload = function() { resolve(true); };
            testImg.onerror = function() { resolve(false); };
            testImg.src = url + '?t=' + Date.now();
          });
          if (exists) {
            link.href = url;
            link.download = id6 + '实习证明.' + extension;
            link.click();
            msg.textContent = "已发起下载，请查看浏览器下载记录。";
            return;
          }
        }
        msg.textContent = "未找到对应的实习证明图片，请检查输入、网络连接或联系老师。";
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
